<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستر أحمد جمال الديب - أستاذ الرياضيات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e3a8a', secondary: '#d97706' },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Student Login Gate -->
    <div id="studentAuthGate" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 md:p-8 shadow-2xl text-center border-4 border-amber-500/30">
            <div class="bg-amber-100 text-amber-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="text-2xl font-black text-primary mb-1">منصة المستر أحمد جمال الديب</h2>
            <p class="text-xs text-slate-500 mb-6">أدخل بياناتك وكلمة المرور الخاصة لدخول المنصة</p>
            <div class="space-y-3">
                <input type="text" id="studentNameInput" placeholder="اسم الطالب الرباعي..." class="w-full p-3 text-sm border-2 rounded-xl outline-none focus:border-amber-500 text-center font-bold">
                <input type="tel" id="studentPhoneInput" placeholder="رقم الهاتف (واتساب)..." class="w-full p-3 text-sm border-2 rounded-xl outline-none focus:border-amber-500 text-center font-bold">
                <!-- تم ضبط نوع الحقل ليكون password لتظهر الكلمة على هيئة نقاط سرية -->
                <input type="password" id="studentPassInput" placeholder="كلمة المرور السرية (2026)..." class="w-full p-3 text-sm border-2 rounded-xl outline-none focus:border-amber-500 text-center tracking-widest font-bold">
                <button type="button" onclick="verifyAndRegisterStudent()" class="w-full bg-secondary hover:bg-amber-600 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg cursor-pointer mt-2">تسجيل الدخول للمنصة</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-secondary text-white p-3 rounded-xl">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black">منصة المستر أحمد جمال الديب</h1>
                    <p class="text-xs text-amber-400">أستاذ الرياضيات</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="logoutStudent()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-2 rounded-lg text-xs font-bold border border-slate-700 transition cursor-pointer">
                    <i class="fa-solid fa-rotate-right"></i> تسجيل خروج
                </button>
                <button type="button" onclick="openPasswordModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition cursor-pointer">
                    <i class="fa-solid fa-lock"></i> لوحة تحكم المستر
                </button>
            </div>
        </div>
    </header>

    <!-- Teacher Special Login Modal -->
    <div id="passwordModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
            <button type="button" onclick="closePasswordModal()" class="absolute left-4 top-4 text-slate-400 hover:text-red-500 text-xl font-bold cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-4">
                <div class="bg-amber-100 text-amber-700 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h3 class="text-lg font-bold text-primary">تسجيل دخول المستر (خاص)</h3>
            </div>
            <div class="space-y-3">
                <input type="text" id="teacherUsernameInput" placeholder="اسم المستخدم..." class="w-full p-3 text-sm border rounded-xl outline-none text-center font-bold" value="eldeeb">
                <input type="password" id="teacherPassInput" placeholder="كلمة المرور..." class="w-full p-3 text-sm border rounded-xl outline-none text-center tracking-widest" value="911200">
                <button type="button" onclick="verifyTeacherCredentials()"
